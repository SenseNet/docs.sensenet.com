server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed .gz files generated by gatsby-plugin-zopfli
    gzip_static on;

    # Gatsby SSG: every page has its own index.html.
    # Try exact file → directory index → .html extension → 404 page.
    location / {
        try_files $uri $uri/ $uri.html /404.html =404;
    }

    # Long-lived cache for hashed static assets
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache for HTML pages so content updates are picked up immediately
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
